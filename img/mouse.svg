<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<radialGradient id="body" cx="50%" cy="40%" r="70%">
<stop offset="0%" stop-color="#cfcfcf"/>
<stop offset="100%" stop-color="#7f7f7f"/>
</radialGradient>

<linearGradient id="ear">
<stop offset="0%" stop-color="#ffd4dc"/>
<stop offset="100%" stop-color="#ff9fb4"/>
</linearGradient>

</defs>

<!-- Shadow -->
<ellipse cx="256" cy="430" rx="120" ry="28" fill="#000" opacity=".18"/>

<!-- Tail -->
<path
d="M340 290
C430 310 445 380 395 445"
fill="none"
stroke="#f5a8b6"
stroke-width="10"
stroke-linecap="round"/>

<!-- Body -->
<ellipse
cx="256"
cy="275"
rx="115"
ry="135"
fill="url(#body)"/>

<!-- Belly -->
<ellipse
cx="256"
cy="315"
rx="60"
ry="82"
fill="#efefef"/>

<!-- Head -->
<circle
cx="256"
cy="160"
r="82"
fill="url(#body)"/>

<!-- Ears -->
<circle cx="195" cy="98" r="34" fill="#8d8d8d"/>
<circle cx="317" cy="98" r="34" fill="#8d8d8d"/>

<circle cx="195" cy="98" r="24" fill="url(#ear)"/>
<circle cx="317" cy="98" r="24" fill="url(#ear)"/>

<!-- Eyes -->
<circle cx="225" cy="155" r="13" fill="#222"/>
<circle cx="287" cy="155" r="13" fill="#222"/>

<circle cx="220" cy="150" r="4" fill="#fff"/>
<circle cx="282" cy="150" r="4" fill="#fff"/>

<!-- Nose -->
<ellipse
cx="256"
cy="195"
rx="15"
ry="10"
fill="#ff9fb4"/>

<!-- Mouth -->
<path
d="M256 205
Q246 214 238 220"
stroke="#444"
stroke-width="3"
fill="none"
stroke-linecap="round"/>

<path
d="M256 205
Q266 214 274 220"
stroke="#444"
stroke-width="3"
fill="none"
stroke-linecap="round"/>

<!-- Whiskers -->
<line x1="240" y1="195" x2="180" y2="185" stroke="#444" stroke-width="2"/>
<line x1="240" y1="202" x2="178" y2="202" stroke="#444" stroke-width="2"/>
<line x1="240" y1="209" x2="182" y2="219" stroke="#444" stroke-width="2"/>

<line x1="272" y1="195" x2="332" y2="185" stroke="#444" stroke-width="2"/>
<line x1="272" y1="202" x2="334" y2="202" stroke="#444" stroke-width="2"/>
<line x1="272" y1="209" x2="330" y2="219" stroke="#444" stroke-width="2"/>

<!-- Arms -->
<ellipse
cx="188"
cy="295"
rx="20"
ry="60"
fill="#8d8d8d"
transform="rotate(-20 188 295)"/>

<ellipse
cx="324"
cy="295"
rx="20"
ry="60"
fill="#8d8d8d"
transform="rotate(20 324 295)"/>

<!-- Feet -->
<ellipse cx="220" cy="400" rx="24" ry="14" fill="#bdbdbd"/>
<ellipse cx="292" cy="400" rx="24" ry="14" fill="#bdbdbd"/>

</svg>