<defs>

<radialGradient id="ground" cx="50%" cy="35%">
<stop offset="0%" stop-color="#9b7756"/>
<stop offset="60%" stop-color="#6f4d34"/>
<stop offset="100%" stop-color="#493222"/>
</radialGradient>

<radialGradient id="hole" cx="50%" cy="40%">
<stop offset="0%" stop-color="#222"/>
<stop offset="55%" stop-color="#111"/>
<stop offset="100%" stop-color="#000"/>
</radialGradient>

<linearGradient id="shine" x1="0" x2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".7"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<filter id="shadow">

<feDropShadow
dx="0"
dy="6"
